server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /coco-annotator {
        return 308 /coco-annotator/$is_args$args;
    }
    location /coco-annotator/socket.io {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://coco-annotator-backend:8000;
        rewrite ^/coco-annotator/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location /coco-annotator/ {
        try_files $uri $uri/ /coco-annotator/index.html;
    }
}
